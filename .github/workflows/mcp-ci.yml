# Tests for the MCP server against the dependency set pip actually resolves — on every PR / push that
# touches mcp/, weekly, and as the gate mcp.yml runs before publishing (workflow_call).
#
# The weekly run is the point: an upstream release can break a fresh `pip install clearcote-mcp` with
# no commit here. 0.1.0 broke that way when mcp 2.x removed `mcp.server.fastmcp`.
name: MCP CI

on:
  pull_request:
    paths:
      - "mcp/**"
      - ".github/workflows/mcp-ci.yml"
  push:
    branches: [main]
    paths:
      - "mcp/**"
      - ".github/workflows/mcp-ci.yml"
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_call: {} # callable as a gate by mcp.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: mcp tests (${{ matrix.deps }} deps, python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # What a fresh install gets today: every dependency resolved from PyPI, nothing pinned.
          - deps: latest
            python: "3.x"
          # The declared floors in mcp/pyproject.toml, on the oldest supported Python.
          - deps: floor
            python: "3.10"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ./mcp from its own metadata (a fresh resolve, like a user's pip install)
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.deps }}" = floor ]; then
            printf 'mcp==1.19.0\nclearcote==0.30.0\n' > "$RUNNER_TEMP/floor.txt"
            python -m pip install ./mcp pytest pytest-asyncio -c "$RUNNER_TEMP/floor.txt"
          else
            python -m pip install ./mcp pytest pytest-asyncio
          fi
          python -m pip list | grep -iE '^(mcp|mcp-types|clearcote|clearcote-mcp) '
      - name: Import the server against the resolved set
        run: python -c "import clearcote_mcp.server, importlib.metadata as m; print('clearcote_mcp.server imports on mcp', m.version('mcp'))"
      - name: Run the MCP tests (stdio round trip included; no browser needed)
        run: python -m pytest mcp/tests -q

  # The npm launcher's route to the Python server (installed server, uvx, pipx, pip) with stub commands on PATH,
  # on the oldest Node it supports.
  launcher:
    name: npm launcher tests (node 18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "18"
      - run: node --test mcp/npm/test/cli.test.js

  # The package exactly as it is on PyPI now. Schedule only: the publish gate must never depend on
  # the release it is about to replace.
  published:
    if: github.event_name == 'schedule'
    name: published clearcote-mcp imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install clearcote-mcp
          python -m pip list | grep -iE '^(mcp|mcp-types|clearcote|clearcote-mcp) '
          python -c "import clearcote_mcp.server"
