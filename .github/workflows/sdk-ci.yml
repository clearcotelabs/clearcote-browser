# Unit tests + version-drift guard for the Node and Python SDKs.
# Runs on every PR / push that touches the SDKs, and is reused by the publish
# workflows (workflow_call) so a release can never go out with failing tests or a
# RELEASE pin that points at a missing / mismatched browser build.
name: SDK CI

on:
  pull_request:
    paths:
      - "sdk/**"
      - "scripts/check_release_pin.py"
      - ".github/workflows/sdk-ci.yml"
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "scripts/check_release_pin.py"
      - ".github/workflows/sdk-ci.yml"
  workflow_call: {} # callable as a gate by npm.yml / pypi.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  node:
    name: node SDK tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # In a temp directory of its own, which the run must leave empty: every directory a test makes
      # is removed again, so a run never piles up in a developer's or runner's temp directory.
      - name: npm test (must leave its temp directory empty)
        run: |
          export TMPDIR="$RUNNER_TEMP/sdk-test-tmp"
          mkdir -p "$TMPDIR"
          npm test
          left="$(ls -A "$TMPDIR")"
          if [ -n "$left" ]; then echo "::error::the test run left these in its temp directory:"; echo "$left"; exit 1; fi

  python:
    name: python SDK tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      # As for Node; pytest keeps only the (empty) base of its tmp_path directories, see pyproject.toml.
      - name: pytest (must leave its temp directory empty)
        run: |
          export TMPDIR="$RUNNER_TEMP/sdk-test-tmp"
          mkdir -p "$TMPDIR"
          pytest -q
          left="$(ls -A "$TMPDIR" | grep -v '^pytest-of-' || true)"
          if [ -n "$left" ]; then echo "::error::the test run left these in its temp directory:"; echo "$left"; exit 1; fi

  release-pin:
    name: version-drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assert RELEASE pin exists on GitHub and checksums match
        run: python scripts/check_release_pin.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
